name: Update Contribution Glitch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_contribution_glitch.py

      - name: Check if graph changed
        id: graph
        run: |
          if git diff --quiet -- contribution-glitch.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Contribution graph did not change."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Contribution graph changed."
          fi

      - name: Update README cache
        if: steps.graph.outputs.changed == 'true'
        run: |
          cache_buster="$(date -u +%Y%m%d%H%M%S)"

          sed -i -E \
            "s#(contribution-glitch\.svg)(\?v=[^\" ]*)?#\1?v=${cache_buster}#g" \
            README.md README.en.md

      - name: Commit changes
        if: steps.graph.outputs.changed == 'true'
        run: |
          git config user.name "G.U.Y[bot]"
          git config user.email "41898282+G.U.Y[bot]@users.noreply.github.com"

          git add contribution-glitch.svg README.md README.en.md

          if git diff --cached --quiet; then
            echo "No changes detected. Nothing to commit."
            exit 0
          fi

          git commit -m "Update contribution graph"
          git push