name: Update Contribution Glitch

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_contribution_glitch.py

      - name: Refresh image cache
        run: |
          cache_buster="$(date -u +%Y%m%d%H%M%S)"
          sed -i -E "s#(contribution-glitch\\.svg)(\\?v=[^\" ]*)?#\\1?v=${cache_buster}#g" README.md README.en.md

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md README.en.md contribution-glitch.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update contribution graph"
            git push
          fi
