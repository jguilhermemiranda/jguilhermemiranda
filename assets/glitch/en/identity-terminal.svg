<svg xmlns="http://www.w3.org/2000/svg" width="680" height="118" viewBox="0 0 680 118" role="img" aria-labelledby="title desc">
  <title id="title">Identity terminal</title>
  <desc id="desc">Terminal output listing the user, groups, and uptime.</desc>
  <rect width="680" height="118" rx="8" fill="#0d1117"/>
  <g font-family="Fira Code, monospace" font-size="14" fill="#C4B5FD">
    <text x="18" y="30">$ id</text>
    <text x="18" y="52">uid=GUI(guy) groups=software, mechatronics, physics</text>
    <text x="18" y="74">$ uptime --fast</text>
    <text x="18" y="96">curiosity: permanent    sleep: deprecated    signal: unstable</text>
  </g>
  <g font-family="Fira Code, monospace" font-size="14" fill="#8B5CF6" opacity=".8">
    <animateTransform attributeName="transform" type="translate" values="0 0;8 1;-5 -1;3 1;0 0" dur=".42s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.85;0;.65;0" dur=".42s" repeatCount="indefinite"/>
    <text x="18" y="30">$ id</text>
    <text x="18" y="52">uid=GUI(guy) groups=software, mechatronics, physics</text>
    <text x="18" y="74">$ uptime --fast</text>
    <text x="18" y="96">curiosity: permanent    sleep: deprecated    signal: unstable</text>
  </g>
</svg>
