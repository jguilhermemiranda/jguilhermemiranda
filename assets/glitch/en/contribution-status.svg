<svg xmlns="http://www.w3.org/2000/svg" width="700" height="50" viewBox="0 0 700 50" role="img" aria-labelledby="title desc">
  <title id="title">Contribution matrix status</title>
  <desc id="desc">Purple contribution signal layer with controlled visual noise.</desc>
  <rect width="700" height="50" rx="8" fill="#0d1117"/>
  <g font-family="Fira Code, monospace" font-size="13" fill="#C4B5FD" stroke="#C4B5FD" stroke-width="0.7" paint-order="stroke">
    <text x="18" y="30">
<animate attributeName="stroke-dasharray" values="0 2000;2000 0;2000 0" dur="1.2s" repeatCount="indefinite"/>
<animate attributeName="fill-opacity" values="0;1;1;1" dur="1.2s" repeatCount="indefinite"/>
[ CONTRIBUTION MATRIX ] :: purple signal layer :: visual noise controlled</text>
  </g>
  <g font-family="Fira Code, monospace" font-size="13" fill="#8B5CF6" opacity=".8" stroke="#8B5CF6" stroke-width="0.7" paint-order="stroke">
    <animateTransform attributeName="transform" type="translate" values="0 0;8 1;-5 -1;3 1;0 0" dur=".42s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.85;0;.65;0" dur=".42s" repeatCount="indefinite"/>
    <text x="18" y="30">
<animate attributeName="stroke-dasharray" values="0 2000;2000 0;2000 0" dur="1.2s" repeatCount="indefinite"/>
<animate attributeName="fill-opacity" values="0;1;1;1" dur="1.2s" repeatCount="indefinite"/>
[ CONTRIBUTION MATRIX ] :: purple signal layer :: visual noise controlled</text>
  </g>
</svg>
