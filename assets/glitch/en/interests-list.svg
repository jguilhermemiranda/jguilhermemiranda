<svg xmlns="http://www.w3.org/2000/svg" width="760" height="184" viewBox="0 0 760 184" role="img" aria-labelledby="title desc">
  <title id="title">Interests</title>
  <desc id="desc">Terminal list of software, hardware, and scientific interests.</desc>
  <rect width="760" height="184" rx="8" fill="#0d1117"/>
  <g font-family="Fira Code, monospace" font-size="13" fill="#C4B5FD">
    <text x="18" y="30">Python            → automation, science, experiments escaping their original scope</text>
    <text x="18" y="52">C++               → embedded systems, things that need to run without excuses</text>
    <text x="18" y="74">ESP32 / ESP8266   → hardware responding to code (sometimes)</text>
    <text x="18" y="96">Arduino           → where it all started</text>
    <text x="18" y="118">embedded systems, electronics, automation</text>
    <text x="18" y="140">physics, mathematics, scientific computing</text>
    <text x="18" y="162">artificial intelligence</text>
  </g>
  <g font-family="Fira Code, monospace" font-size="13" fill="#8B5CF6" opacity=".8">
    <animateTransform attributeName="transform" type="translate" values="0 0;8 1;-5 -1;3 1;0 0" dur=".42s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.85;0;.65;0" dur=".42s" repeatCount="indefinite"/>
    <text x="18" y="30">Python            → automation, science, experiments escaping their original scope</text>
    <text x="18" y="52">C++               → embedded systems, things that need to run without excuses</text>
    <text x="18" y="74">ESP32 / ESP8266   → hardware responding to code (sometimes)</text>
    <text x="18" y="96">Arduino           → where it all started</text>
    <text x="18" y="118">embedded systems, electronics, automation</text>
    <text x="18" y="140">physics, mathematics, scientific computing</text>
    <text x="18" y="162">artificial intelligence</text>
  </g>
</svg>
