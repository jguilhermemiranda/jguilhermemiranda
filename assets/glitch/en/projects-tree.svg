<svg xmlns="http://www.w3.org/2000/svg" width="720" height="96" viewBox="0 0 720 96" role="img" aria-labelledby="title desc">
  <title id="title">Projects directory tree</title>
  <desc id="desc">Terminal directory tree listing the G.U.Y. and smart-stock projects.</desc>
  <rect width="720" height="96" rx="8" fill="#0d1117"/>
  <g font-family="Fira Code, monospace" font-size="13" fill="#C4B5FD">
    <text x="18" y="30">drwxr-xr-x  ./projects/</text>
    <text x="18" y="52">├── G.U.Y.       [python / local AI / agents]</text>
    <text x="18" y="74">└── smart-stock  [embedded / automation / mechatronics]</text>
  </g>
  <g font-family="Fira Code, monospace" font-size="13" fill="#8B5CF6" opacity=".8">
    <animateTransform attributeName="transform" type="translate" values="0 0;8 1;-5 -1;3 1;0 0" dur=".42s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.85;0;.65;0" dur=".42s" repeatCount="indefinite"/>
    <text x="18" y="30">drwxr-xr-x  ./projects/</text>
    <text x="18" y="52">├── G.U.Y.       [python / local AI / agents]</text>
    <text x="18" y="74">└── smart-stock  [embedded / automation / mechatronics]</text>
  </g>
</svg>
