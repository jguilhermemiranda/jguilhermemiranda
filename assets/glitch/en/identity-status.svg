<svg xmlns="http://www.w3.org/2000/svg" width="440" height="50" viewBox="0 0 440 50" role="img" aria-labelledby="title desc">
  <title id="title">Identity status</title>
  <desc id="desc">Online identity status with a clean signal, in purple glitch text.</desc>
  <rect width="440" height="50" rx="8" fill="#0d1117"/>
  <g font-family="Fira Code, monospace" font-size="13" fill="#C4B5FD">
    <text x="18" y="30">[ IDENTITY ] // online // signal: clean</text>
  </g>
  <g font-family="Fira Code, monospace" font-size="13" fill="#8B5CF6" opacity=".8">
    <animateTransform attributeName="transform" type="translate" values="0 0;8 1;-5 -1;3 1;0 0" dur=".42s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.85;0;.65;0" dur=".42s" repeatCount="indefinite"/>
    <text x="18" y="30">[ IDENTITY ] // online // signal: clean</text>
  </g>
</svg>
