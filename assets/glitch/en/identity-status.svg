<svg xmlns="http://www.w3.org/2000/svg" width="440" height="50" viewBox="0 0 440 50" role="img" aria-labelledby="title desc">
  <title id="title">Whoami command</title>
  <desc id="desc">Command prompt being typed in real time as a terminal animation.</desc>
  <defs>
    <clipPath id="whoami-clip-en">
      <rect x="18" y="0" width="200" height="40">
        <animate attributeName="width" values="0;0;200;200;0" dur="1.5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="440" height="50" rx="8" fill="#0d1117"/>

  <g fill="#C4B5FD" font-family="Fira Code, monospace" font-size="13">
    <g clip-path="url(#whoami-clip-en)">
      <text x="18" y="30">$ whoami</text>
    </g>
  </g>

  <rect x="112" y="20" width="8" height="14" fill="#C4B5FD">
    <animate attributeName="opacity" values="0;1;1;0;0" dur="1.5s" repeatCount="indefinite"/>
  </rect>
</svg>
