<svg xmlns="http://www.w3.org/2000/svg" width="600" height="96" viewBox="0 0 600 96" role="img" aria-labelledby="title desc">
  <title id="title">Education terminal</title>
  <desc id="desc">Terminal showing curriculum checksum, specialization, and current learning state.</desc>
  <rect width="600" height="96" rx="8" fill="#0d1117"/>
  <g font-family="Fira Code, monospace" font-size="13" fill="#C4B5FD">
    <text x="18" y="30">&gt; curriculum checksum: valid</text>
    <text x="18" y="52">&gt; specialization: making software touch reality</text>
    <text x="18" y="74">&gt; last known state: still learning</text>
  </g>
  <g font-family="Fira Code, monospace" font-size="13" fill="#8B5CF6" opacity=".8">
    <animateTransform attributeName="transform" type="translate" values="0 0;8 1;-5 -1;3 1;0 0" dur=".42s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.85;0;.65;0" dur=".42s" repeatCount="indefinite"/>
    <text x="18" y="30">&gt; curriculum checksum: valid</text>
    <text x="18" y="52">&gt; specialization: making software touch reality</text>
    <text x="18" y="74">&gt; last known state: still learning</text>
  </g>
</svg>
