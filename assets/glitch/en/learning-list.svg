<svg xmlns="http://www.w3.org/2000/svg" width="700" height="184" viewBox="0 0 700 184" role="img" aria-labelledby="title desc">
  <title id="title">Current learning feed</title>
  <desc id="desc">Terminal feed listing current study topics and a focus warning.</desc>
  <rect width="700" height="184" rx="8" fill="#0d1117"/>
  <g font-family="Fira Code, monospace" font-size="13" fill="#C4B5FD">
    <text x="18" y="30">[...] data structures &amp; algorithms</text>
    <text x="18" y="52">[...] software architecture</text>
    <text x="18" y="74">[...] databases</text>
    <text x="18" y="96">[...] computer networks</text>
    <text x="18" y="118">[...] embedded systems</text>
    <text x="18" y="140">[...] mathematical modeling &amp; physics simulation</text>
    <text x="18" y="162">[..//WARN..] progress detected; restarting focus...</text>
  </g>
  <g font-family="Fira Code, monospace" font-size="13" fill="#8B5CF6" opacity=".8">
    <animateTransform attributeName="transform" type="translate" values="0 0;8 1;-5 -1;3 1;0 0" dur=".42s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.85;0;.65;0" dur=".42s" repeatCount="indefinite"/>
    <text x="18" y="30">[...] data structures &amp; algorithms</text>
    <text x="18" y="52">[...] software architecture</text>
    <text x="18" y="74">[...] databases</text>
    <text x="18" y="96">[...] computer networks</text>
    <text x="18" y="118">[...] embedded systems</text>
    <text x="18" y="140">[...] mathematical modeling &amp; physics simulation</text>
    <text x="18" y="162">[..//WARN..] progress detected; restarting focus...</text>
  </g>
</svg>
