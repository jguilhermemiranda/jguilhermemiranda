<svg xmlns="http://www.w3.org/2000/svg" width="700" height="118" viewBox="0 0 700 118" role="img" aria-labelledby="title desc">
  <title id="title">System online</title>
  <desc id="desc">Terminal system status with a purple glitch animation.</desc>
  <rect width="700" height="118" rx="8" fill="#0d1117"/>
  <g font-family="Fira Code, monospace" font-size="14" fill="#C4B5FD">
    <text x="18" y="30">[ SYSTEM ONLINE ]  /guy  :: tty/0  :: signal 87%</text>
    <text x="18" y="52">&gt; loading engineering_stack ...</text>
    <text x="18" y="74">&gt; profile status: stable-ish</text>
    <text x="18" y="96">&gt; operator: human // proceed with caution</text>
  </g>
  <g font-family="Fira Code, monospace" font-size="14" fill="#8B5CF6" opacity=".8">
    <animateTransform attributeName="transform" type="translate" values="0 0;8 1;-5 -1;3 1;0 0" dur=".42s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.85;0;.65;0" dur=".42s" repeatCount="indefinite"/>
    <text x="18" y="30">[ SYSTEM ONLINE ]  /guy  :: tty/0  :: signal 87%</text>
    <text x="18" y="52">&gt; loading engineering_stack ...</text>
    <text x="18" y="74">&gt; profile status: stable-ish</text>
    <text x="18" y="96">&gt; operator: human // proceed with caution</text>
  </g>
</svg>
