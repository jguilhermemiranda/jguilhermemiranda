<svg xmlns="http://www.w3.org/2000/svg" width="740" height="184" viewBox="0 0 740 184" role="img" aria-labelledby="title desc">
  <title id="title">Interests</title>
  <desc id="desc">Terminal list of software, hardware, and scientific interests.</desc>
  <rect width="740" height="184" rx="8" fill="#0d1117"/>
  <g font-family="Fira Code, monospace" font-size="13" fill="#C4B5FD">
    <text x="18" y="30">Python            → automação, ciência, experimentos que fogem do escopo original</text>
    <text x="18" y="52">C++               → sistemas embarcados, coisas que precisam rodar sem desculpa</text>
    <text x="18" y="74">ESP32 / ESP8266   → hardware que responde ao código (às vezes)</text>
    <text x="18" y="96">Arduino           → onde tudo isso começou</text>
    <text x="18" y="118">sistemas embarcados, eletrônica, automação</text>
    <text x="18" y="140">física, matemática, computação científica</text>
    <text x="18" y="162">inteligência artificial</text>
  </g>
  <g font-family="Fira Code, monospace" font-size="13" fill="#8B5CF6" opacity=".8">
    <animateTransform attributeName="transform" type="translate" values="0 0;8 1;-5 -1;3 1;0 0" dur=".42s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.85;0;.65;0" dur=".42s" repeatCount="indefinite"/>
    <text x="18" y="30">Python            → automação, ciência, experimentos que fogem do escopo original</text>
    <text x="18" y="52">C++               → sistemas embarcados, coisas que precisam rodar sem desculpa</text>
    <text x="18" y="74">ESP32 / ESP8266   → hardware que responde ao código (às vezes)</text>
    <text x="18" y="96">Arduino           → onde tudo isso começou</text>
    <text x="18" y="118">sistemas embarcados, eletrônica, automação</text>
    <text x="18" y="140">física, matemática, computação científica</text>
    <text x="18" y="162">inteligência artificial</text>
  </g>
</svg>
