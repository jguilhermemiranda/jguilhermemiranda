  <rect width="520" height="50" rx="8" fill="#0d1117"/>
  <g font-family="Fira Code, monospace" font-size="13" fill="#C4B5FD">
    <text x="18" y="30">[ RECORD ] // education // checksum: valid</text>
  </g>
